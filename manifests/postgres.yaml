apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP_NAME}-pg
  namespace: app-${APP_NAME}
  labels:
    app.kubernetes.io/name: ${APP_NAME}-pg
    app.kubernetes.io/component: pg-cluster
    app: ${APP_NAME}
spec:
  instances: 1
  bootstrap:
    initdb:
      database: ${APP_NAME}
      owner: ${APP_NAME}
  postgresql:
    parameters:
      shared_buffers: 64MB
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 512Mi
  storage:
    size: 10Gi
    storageClass: gp3
  walStorage:
    size: 10Gi
    storageClass: gp3
