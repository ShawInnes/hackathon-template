apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  namespace: app-${APP_NAME}
  labels:
    app.kubernetes.io/name: ${APP_NAME}
    app.kubernetes.io/component: deployment
    app: ${APP_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${APP_NAME}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      containers:
        - name: app
          image: ${IMAGE}
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ${APP_NAME}-config
            - secretRef:
                name: ${APP_NAME}-secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${APP_NAME}-pg-app
                  key: uri
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${APP_NAME}-pg-app
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ${APP_NAME}-pg-app
                  key: user
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: ${APP_NAME}-pg-app
                  key: dbname
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${APP_NAME}-pg-app
                  key: password
            - name: DB_PORT
              value: "5432"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
