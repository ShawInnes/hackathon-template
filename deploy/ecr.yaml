# Crossplane-managed ECR repository, outside the Helm chart — the image
# repository is infrastructure, not an app deployment concern. Applied
# automatically by deploy/scripts/ensure-ecr.sh at the start of every
# BuildAndPublish run (kubectl apply is a no-op once it already exists).
#
# Usage: envsubst < deploy/ecr.yaml | kubectl apply -f -
#   APP_NAME - app/repository name, e.g. hackathon-template
apiVersion: ecr.aws.m.upbound.io/v1beta1
kind: Repository
metadata:
  name: ${APP_NAME}
  namespace: app-${APP_NAME}
  annotations:
    crossplane.io/external-name: ${APP_NAME}
spec:
  forProvider:
    imageTagMutability: MUTABLE
    region: ap-southeast-2
