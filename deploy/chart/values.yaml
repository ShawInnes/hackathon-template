# Shared chart defaults. Put application/environment differences in values-<environment>.yaml.
# externalSecret.ssmPath overrides the default <ssmPathPrefix>/<appName> path.
# SSM parameters use lower-kebab-case; all matching keys become UPPER_SNAKE_CASE env vars.
# postgres.appSuperuser applies only during initial database bootstrap; default false.
appName: ""
replicaCount: 1
image:
  repository: ""
  tag: latest
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
ingress:
  className: nginx
  host: ""
  extraHosts: []
auth:
  enabled: false
config: {}
externalSecret:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm-store
    kind: ClusterSecretStore
  ssmPathPrefix: /techlab/workloads
  ssmPath: ""
postgres:
  enabled: true
  appSuperuser: false
  instances: 1
  sharedBuffers: 64MB
  memory: 512Mi
  storageSize: 10Gi
  walStorageSize: 10Gi
  storageClass: gp3
  backup:
    enabled: false
    schedule: 0 0 3 * * *
    retentionPolicy: 30d
    destinationBucket: ""
    iamRoleArn: ""
externalDatabase:
  existingSecret: ""
  secretKey: uri
