{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "app.name" . }}-pg
  namespace: {{ include "app.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "app.name" . }}-pg
    app.kubernetes.io/component: pg-cluster
    app: {{ include "app.name" . }}
spec:
  instances: {{ .Values.postgres.instances }}
  bootstrap:
    initdb:
      database: {{ include "app.name" . }}
      owner: {{ include "app.name" . }}
      postInitSQL:
        - ALTER ROLE "{{ include "app.name" . }}" WITH SUPERUSER
  postgresql:
    parameters:
      shared_buffers: {{ .Values.postgres.sharedBuffers }}
  resources:
    requests:
      memory: {{ .Values.postgres.memory }}
    limits:
      memory: {{ .Values.postgres.memory }}
  storage:
    size: {{ .Values.postgres.storageSize }}
    storageClass: {{ .Values.postgres.storageClass }}
  walStorage:
    size: {{ .Values.postgres.walStorageSize }}
    storageClass: {{ .Values.postgres.storageClass }}
{{- if .Values.postgres.backup.enabled }}
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: {{ required "postgres.backup.iamRoleArn is required when postgres.backup.enabled is true (set via TeamCity)" .Values.postgres.backup.iamRoleArn }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      enabled: true
      parameters:
        barmanObjectName: {{ include "app.name" . }}-backup
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "app.name" . }}-backup
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: pg-backup
spec:
  retentionPolicy: {{ .Values.postgres.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: s3://{{ required "postgres.backup.destinationBucket is required when postgres.backup.enabled is true (set via TeamCity)" .Values.postgres.backup.destinationBucket }}/{{ include "app.name" . }}
    s3Credentials:
      inheritFromIAMRole: true
    wal:
      compression: bzip2
    data:
      compression: bzip2
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "app.name" . }}-backup
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: pg-backup
spec:
  immediate: true
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ include "app.name" . }}-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- end }}
