apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.name" . }}-config
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: configmap
data:
  APP_NAME: {{ include "app.name" . | quote }}
  NAMESPACE: {{ include "app.namespace" . | quote }}
  AUTH_URL: "https://{{ .Values.ingress.host }}"
  AUTH_ENABLED: {{ .Values.auth.enabled | quote }}
  {{- if .Values.auth.oidcId }}
  AUTH_OIDC_ID: {{ .Values.auth.oidcId | quote }}
  {{- end }}
  {{- if .Values.auth.oidcIssuer }}
  AUTH_OIDC_ISSUER: {{ .Values.auth.oidcIssuer | quote }}
  {{- end }}
