apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.name" . }}-config
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: configmap
data:
  APP_NAME: {{ include "app.name" . | quote }}
  NAMESPACE: {{ include "app.namespace" . | quote }}
  AUTH_URL: "https://{{ .Values.ingress.host }}"
  APP_BASE_URL: "https://{{ .Values.ingress.host }}"
  AUTH_ENABLED: {{ .Values.auth.enabled | quote }}
  {{- range $key, $value := .Values.config }}
  {{- if has $key (list "APP_NAME" "NAMESPACE" "AUTH_URL" "APP_BASE_URL" "AUTH_ENABLED" "DATABASE_URL" "PORT") }}
  {{- fail (printf "config.%s is reserved" $key) }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
