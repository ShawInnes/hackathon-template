{{- $path := default (printf "%s/%s" (trimSuffix "/" .Values.externalSecret.ssmPathPrefix) (include "app.name" .)) .Values.externalSecret.ssmPath -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.name" . }}-secret
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "app.name" . }}-secret
    # Retain existing namespaced Secrets when adopting legacy deployments.
    creationPolicy: Orphan
    deletionPolicy: Retain
  # Require the authentication secret even if path discovery returns no keys.
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: {{ printf "%s/auth-secret" $path | quote }}
  dataFrom:
    - find:
        path: {{ $path | quote }}
        name:
          regexp: {{ printf "^%s/[a-z][a-z0-9]*(-[a-z0-9]+)*$" (regexQuoteMeta $path) | quote }}
      rewrite:
        - regexp:
            source: "^.*/"
            target: ""
        - transform:
            template: '{{ `{{ .value | replace "-" "_" | upper }}` }}'
